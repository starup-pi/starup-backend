              $ref: '#/components/schemas/PerfilEmpresaClienteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PerfilEmpresaClienteRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
