openapi: 3.0.3
info:
  title: Nexora API
  version: 1.0.0
  description: Demandas, propostas, avaliações e feed público.
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/categories/:
    get:
      operationId: categories_list
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - categories
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
  /api/v1/demands/:
    get:
      operationId: demands_list
      parameters:
      - in: query
        name: mine
        schema:
          type: boolean
          default: false
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: status
        schema:
          enum:
          - OPEN
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
          type: string
          minLength: 1
        description: |-
          * `OPEN` - OPEN
          * `IN_PROGRESS` - IN_PROGRESS
          * `COMPLETED` - COMPLETED
          * `CANCELLED` - CANCELLED
      - in: query
        name: visibility
        schema:
          enum:
          - PUBLIC
          - PRIVATE
          type: string
          minLength: 1
        description: |-
          * `PUBLIC` - PUBLIC
          * `PRIVATE` - PRIVATE
      tags:
      - demands
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDemandList'
          description: ''
    post:
      operationId: demands_create
      tags:
      - demands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DemandWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DemandWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Demand'
          description: ''
  /api/v1/demands/{id}/:
    get:
      operationId: demands_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - demands
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Demand'
          description: ''
    patch:
      operationId: demands_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - demands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDemandWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDemandWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDemandWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Demand'
          description: ''
  /api/v1/demands/{id}/cancel/:
    post:
      operationId: demands_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - demands
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Demand'
          description: ''
  /api/v1/feed/:
    get:
      operationId: feed_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: O valor do cursor de paginação.
        schema:
          type: string
      tags:
      - feed
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeedPostList'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAccount'
          description: ''
    delete:
      operationId: me_destroy
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/my-startups/{id}/:
    patch:
      operationId: my_startups_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - my-startups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStartupUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStartupUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStartupUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/push/config/:
    get:
      operationId: push_config_retrieve
      tags:
      - push
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushConfig'
          description: ''
  /api/v1/push/subscriptions/:
    post:
      operationId: push_subscriptions_create
      tags:
      - push
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionResult'
          description: ''
  /api/v1/push/subscriptions/{subscription_id}/:
    delete:
      operationId: push_subscriptions_destroy
      parameters:
      - in: path
        name: subscription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - push
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/reviews/:
    post:
      operationId: reviews_create
      tags:
      - reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
  /api/v1/solutions/:
    get:
      operationId: solutions_list
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - solutions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSolutionList'
          description: ''
    post:
      operationId: solutions_create
      tags:
      - solutions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolutionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SolutionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SolutionCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solution'
          description: ''
  /api/v1/solutions/{id}/:
    get:
      operationId: solutions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - solutions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solution'
          description: ''
  /api/v1/solutions/{id}/history/:
    get:
      operationId: solutions_history_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - solutions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStatusEventList'
          description: ''
  /api/v1/solutions/{id}/transition/:
    post:
      operationId: solutions_transition_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - solutions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolutionTransitionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SolutionTransitionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SolutionTransitionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solution'
          description: ''
  /api/v1/startups/:
    get:
      operationId: startups_list
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - startups
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicStartupList'
          description: ''
  /api/v1/startups/{id}/:
    get:
      operationId: startups_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - startups
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStartup'
          description: ''
components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
      - slug
    Csrf:
      type: object
      properties:
        csrf_token:
          type: string
        policy_version:
          type: string
      required:
      - csrf_token
    Demand:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        status:
          type: string
        visibility:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - category_id
      - category_name
      - completed_at
      - created_at
      - description
      - id
      - status
      - title
      - updated_at
      - visibility
    DemandFeed:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/DemandFeedKindEnum'
        published_at:
          type: string
          format: date-time
        content:
          $ref: '#/components/schemas/Demand'
      required:
      - content
      - id
      - kind
      - published_at
    DemandFeedKindEnum:
      enum:
      - DEMAND
      type: string
      description: '* `DEMAND` - DEMAND'
    DemandWriteRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 10000
        category_id:
          type: string
          format: uuid
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          default: PUBLIC
      required:
      - category_id
      - description
      - title
    FeedPost:
      oneOf:
      - $ref: '#/components/schemas/DemandFeed'
      - $ref: '#/components/schemas/StartupFeed'
      - $ref: '#/components/schemas/ReviewedSolutionFeed'
      discriminator:
        propertyName: kind
        mapping:
          DEMAND: '#/components/schemas/DemandFeed'
          STARTUP: '#/components/schemas/StartupFeed'
          REVIEWED_SOLUTION: '#/components/schemas/ReviewedSolutionFeed'
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedDemandList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Demand'
    PaginatedFeedPostList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/FeedPost'
    PaginatedPublicStartupList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicStartup'
    PaginatedSolutionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Solution'
    PaginatedStatusEventList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/StatusEvent'
    PatchedDemandWriteRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 10000
        category_id:
          type: string
          format: uuid
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          default: PUBLIC
    PatchedStartupUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 300
        website:
          type: string
          format: uri
    PersonTypeEnum:
      enum:
      - PF
      - PJ
      type: string
      description: |-
        * `PF` - PF
        * `PJ` - PJ
    PrivateAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        legal_name:
          type: string
        profile:
          type: object
          additionalProperties: {}
      required:
      - email
      - id
      - legal_name
      - profile
      - role
    PublicStartup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        website:
          type: string
        category:
          type: string
        average_rating:
          type: number
          format: double
          nullable: true
        review_count:
          type: integer
      required:
      - average_rating
      - category
      - description
      - id
      - name
      - review_count
      - website
    PushConfig:
      type: object
      properties:
        public_key:
          type: string
      required:
      - public_key
    PushKeysRequest:
      type: object
      properties:
        p256dh:
          type: string
          minLength: 1
          maxLength: 128
        auth:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - auth
      - p256dh
    PushSubscriptionRequest:
      type: object
      properties:
        endpoint:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
        keys:
          $ref: '#/components/schemas/PushKeysRequest'
        consent:
          type: boolean
      required:
      - consent
      - endpoint
      - keys
    PushSubscriptionResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    RegistrationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        role:
          $ref: '#/components/schemas/RoleEnum'
        policy_version:
          type: string
          minLength: 1
          maxLength: 32
        legal_name:
          type: string
          maxLength: 150
        person_type:
          $ref: '#/components/schemas/PersonTypeEnum'
        document:
          type: string
          minLength: 1
          maxLength: 32
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        startup_name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 300
        website:
          type: string
          format: uri
      required:
      - email
      - password
      - policy_version
      - role
    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        solution_id:
          type: string
          format: uuid
        rating:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - id
      - rating
      - solution_id
    ReviewCreateRequest:
      type: object
      properties:
        solution_id:
          type: string
          format: uuid
        rating:
          type: integer
          maximum: 5
          minimum: 1
      required:
      - rating
      - solution_id
    ReviewedSolutionContent:
      type: object
      properties:
        review_id:
          type: string
          format: uuid
        solution_id:
          type: string
          format: uuid
        rating:
          type: integer
          maximum: 5
          minimum: 1
        startup_id:
          type: string
          format: uuid
        startup_name:
          type: string
        demand_id:
          type: string
          format: uuid
        demand_title:
          type: string
      required:
      - demand_id
      - demand_title
      - rating
      - review_id
      - solution_id
      - startup_id
      - startup_name
    ReviewedSolutionFeed:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ReviewedSolutionFeedKindEnum'
        published_at:
          type: string
          format: date-time
        content:
          $ref: '#/components/schemas/ReviewedSolutionContent'
      required:
      - content
      - id
      - kind
      - published_at
    ReviewedSolutionFeedKindEnum:
      enum:
      - REVIEWED_SOLUTION
      type: string
      description: '* `REVIEWED_SOLUTION` - REVIEWED_SOLUTION'
    RoleEnum:
      enum:
      - CLIENT
      - STARTUP
      - INVESTOR
      type: string
      description: |-
        * `CLIENT` - CLIENT
