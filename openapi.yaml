          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPerfilEmpresaClienteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPerfilEmpresaClienteRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilEmpresaCliente'
          description: ''
    delete:
      operationId: perfis_empresa_cliente_destroy
      description: CRUD da entidade PERFIL_EMPRESA_CLIENTE.
      summary: Remove um perfil de empresa cliente
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este Perfil de Empresa Cliente.
        required: true
      tags:
      - Perfil Empresa Cliente
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
