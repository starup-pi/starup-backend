openapi: 3.0.3
info:
  title: Nexora API
  version: 0.1.0
  description: 'API REST das entidades base da Nexora: USUARIO e os perfis PERFIL_STARTUP,
    PERFIL_EMPRESA_CLIENTE, PERFIL_INVESTIDOR e PERFIL_ENTIDADE_FOMENTO — a fundação
    de autenticação/identidade sobre a qual o restante do domínio (ofertas, execuções
    de teste, editais e eventos) é construído.'
paths:
  /api/v1/perfis-empresa-cliente/:
    get:
      operationId: perfis_empresa_cliente_list
      description: CRUD da entidade PERFIL_EMPRESA_CLIENTE.
      summary: Lista perfis de empresa cliente
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: porte_empresa
        schema:
          type: string
          title: Porte da empresa
          enum:
          - EPP
          - ME
          - MEDIO_PORTE
          - MEI
        description: |-
          * `MEI` - MEI
          * `ME` - Microempresa
          * `EPP` - Empresa de Pequeno Porte
          * `MEDIO_PORTE` - Médio Porte
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: segmento_operacional
        schema:
          type: string
          enum:
          - CLINICA
          - DISTRIBUIDORA
          - LOGISTICA_LOCAL
          - MERCADO_VAREJO
          - OFICINA_MECANICA
          - OUTROS
          - RESTAURANTE
        description: |-
          * `OFICINA_MECANICA` - Oficina Mecânica
          * `MERCADO_VAREJO` - Mercado / Varejo
          * `DISTRIBUIDORA` - Distribuidora
          * `RESTAURANTE` - Restaurante
          * `CLINICA` - Clínica
          * `LOGISTICA_LOCAL` - Logística Local
          * `OUTROS` - Outros
      tags:
      - Perfil Empresa Cliente
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPerfilEmpresaClienteList'
          description: ''
    post:
      operationId: perfis_empresa_cliente_create
      description: CRUD da entidade PERFIL_EMPRESA_CLIENTE.
      summary: Cria um perfil de empresa cliente
      tags:
      - Perfil Empresa Cliente
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilEmpresaClienteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PerfilEmpresaClienteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PerfilEmpresaClienteRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilEmpresaCliente'
          description: ''
  /api/v1/perfis-empresa-cliente/{id}/:
    get:
      operationId: perfis_empresa_cliente_retrieve
      description: CRUD da entidade PERFIL_EMPRESA_CLIENTE.
      summary: Detalha um perfil de empresa cliente
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este Perfil de Empresa Cliente.
        required: true
      tags:
      - Perfil Empresa Cliente
      security:
      - cookieAuth: []
      - basicAuth: []
